<!doctype html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebula Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Nebula</span></div>
    <nav>
      <button class="nav" data-page="play">
        <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg><span>Graj</span>
      </button>
      <button class="nav" data-page="instances">
        <svg viewBox="0 0 24 24"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg><span>Instalacje</span>
      </button>
      <button class="nav" data-page="accounts">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Konta</span>
      </button>
      <button class="nav" data-page="settings">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span>Ustawienia</span>
      </button>
    </nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <main id="view"></main>
  <div id="toast"></div>
  <script src="app.js"></script>
  <script src="instances.js"></script>
  <script src="accounts.js"></script>
  <script src="settings.js"></script>
</body>
</html>
