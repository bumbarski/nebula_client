name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Mod Nebula Client (.jar). Na gałęzi main trafia do wydania "nebula-latest", skąd pobiera go launcher.
  mod:
    name: mod (${{ matrix.mc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.2"
            api: "0.152.2+26.2"
            dep: ">=26.2"
            compat: gui
            dir: nebula-client
            java: 25
            loader: "0.19.3"
          - mc: "26.1.2"
            api: "0.155.3+26.1.2"
            dep: "~26.1"
            compat: classic
            dir: nebula-client
            java: 25
            loader: "0.19.3"
          - mc: "1.21.4"
            api: "0.119.4+1.21.4"
            dep: "~1.21.4"
            compat: classic
            dir: nebula-client-1214
            java: 21
            loader: "0.16.14"
          - mc: "1.21.11"
            api: "AUTO"
            dep: "~1.21.11"
            compat: classic
            dir: nebula-client-12111
            java: 21
            loader: "0.18.1"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Wygeneruj projekt dla starszych wersji
        if: matrix.dir != 'nebula-client'
        working-directory: .
        run: python3 tools/port_1214.py ${{ matrix.mc }}

      - name: Znajdz Fabric API
        if: matrix.api == 'AUTO'
        working-directory: .
        run: |
          V=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oE "<version>[^<]*\+${{ matrix.mc }}</version>" | sed 's/<[^>]*>//g' | tail -1)
          echo "FABRIC_API=$V" >> $GITHUB_ENV

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle build --console=plain --stacktrace -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version="${{ matrix.api == 'AUTO' && env.FABRIC_API || matrix.api }}" -Ploader_version=${{ matrix.loader }} "-Pminecraft_dep=${{ matrix.dep }}" -Pcompat=${{ matrix.compat }} -Pmod_version=0.1.0-mc${{ matrix.mc }} > build.log 2>&1

      - name: Pokaż błędy builda
        if: failure()
        run: |
          { grep -E -A3 "error:|symbol:|What went wrong|Could not" build.log | sed 's#.*/dev/nebula/client/##' | head -c 3400; } > err.txt || true
          node ../launcher/test/annotate.js err.txt "Błędy builda ${{ matrix.mc }}" error 3600

      - name: Przygotuj jar do wydania
        run: |
          mkdir -p ../dist-mod
          find build/libs -name 'nebula-client-*.jar' ! -name '*-sources.jar' -exec cp {} ../dist-mod/ \;
          ls -la ../dist-mod

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-client-${{ matrix.mc }}
          path: dist-mod/*.jar

      - name: Publikuj jar w wydaniu nebula-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-latest
          name: Nebula (najnowszy build)
          body: |
            Automatyczny build z commita ${{ github.sha }}.
            - nebula-client-*.jar: mod Nebula Client (launcher pobiera go sam)
            - NebulaLauncher-*.exe: launcher dla Windows
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist-mod/nebula-client-*.jar

  # 2. Launcher (.exe) budowany na Windows i dołączany do tego samego wydania.
  launcher:
    needs: mod
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zależności
        run: npm install --no-audit --no-fund > npm.log 2>&1

      - name: Testy launchera
        run: npm test > test.log 2>&1

      - name: Zbuduj .exe
        run: npm run dist > dist.log 2>&1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Pokaż logi przy błędzie
        if: failure()
        run: |
          node test/annotate.js npm.log "npm install" error 3000
          node test/annotate.js test.log "Testy launchera" error 3000
          node test/annotate.js dist.log "electron-builder" error 5000

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-launcher
          path: launcher/dist/NebulaLauncher-*.exe

      - name: Dołącz .exe do wydania
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-latest
          fail_on_unmatched_files: true
          files: launcher/dist/NebulaLauncher-*.exe

  # 3. Test na prawdziwych serwerach Mojang/Fabric/Modrinth + próbny start gry bez okna.
  smoke:
    needs: mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test na prawdziwych serwerach
        run: node test/smoke-net.js > smoke.out 2>&1

      - name: Raport
        if: always()
        run: node test/annotate.js smoke-report.txt "Smoke test" notice 7500
