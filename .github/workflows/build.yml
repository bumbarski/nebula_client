name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebula-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle build --console=plain --stacktrace > build.log 2>&1

      - name: Pokaż błędy builda
        if: failure()
        run: |
          {
            echo "--- BLEDY ---"
            grep -nE "error:|What went wrong|Could not|not found|Unsupported" -A4 build.log | head -90
            echo "--- KONIEC LOGU ---"
            tail -30 build.log
          } > summary.txt
          python3 - <<'EOF'
          s = open('summary.txt', encoding='utf-8', errors='replace').read()[:7000]
          s = s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Log builda::' + s)
          EOF

      - name: Diagnostyka API Minecrafta
        if: always()
        run: |
          JAR=""
          for j in $(find ~/.gradle ~/.cache -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then JAR="$j"; break; fi
          done
          {
            echo "JAR: $JAR"
            echo "--- Minecraft.setScreenAndShow: wywolania ---"
            javap -p -c -cp "$JAR" net.minecraft.client.Minecraft | awk '/public void setScreenAndShow/{f=1} f{print} f&&/^$/{exit}' | grep -E 'invoke' | sed 's/^ *[0-9]*: //' | head -25
            echo "--- Gui.setScreen: wywolania ---"
            javap -p -c -cp "$JAR" net.minecraft.client.gui.Gui | awk '/public void setScreen\(/{f=1} f{print} f&&/^$/{exit}' | grep -E 'invoke' | sed 's/^ *[0-9]*: //' | head -25
            echo "--- Gui: odwolania do hide ---"
            javap -p -c -cp "$JAR" net.minecraft.client.gui.Gui | grep -iE 'hide|hidden' | sed 's/^ *[0-9]*: //' | sort -u | head -10
            echo "--- Minecraft: odwolania do hide ---"
            javap -p -c -cp "$JAR" net.minecraft.client.Minecraft | grep -iE 'hide|hidden' | sed 's/^ *[0-9]*: //' | sort -u | head -10
          } > diag.txt 2>&1
          python3 - <<'EOF'
          s = open('diag.txt', encoding='utf-8', errors='replace').read()[:7000]
          s = s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Diagnostyka::' + s)
          EOF

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nebula-client
          path: |
            nebula-client/build/libs/*.jar
            !nebula-client/build/libs/*-sources.jar
