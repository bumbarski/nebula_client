name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Mod Nebula Client (.jar). Na gałęzi main trafia do wydania "nebula-latest", skąd pobiera go launcher.
  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebula-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle build --console=plain --stacktrace > build.log 2>&1

      - name: Pokaż błędy builda
        if: failure()
        run: node ../launcher/test/annotate.js build.log "Log builda moda" error 7000

      - name: TYMCZASOWA diagnostyka API Minecrafta
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-client.jar' | head -1)
          sig() { javap -p -cp "$JAR" "$1" 2>&1 | grep -E "$2" | grep -v lambda | sed 's/net\.minecraft\.//g' | head -${3:-40}; }
          { echo "JAR: $JAR"; echo "--- GuiGraphicsExtractor: przedmioty"; sig net.minecraft.client.gui.GuiGraphicsExtractor 'tem|Item'; } > d1.txt
          { echo "--- Camera"; sig net.minecraft.client.Camera 'public|protected|private .*\(' 60; } > d2.txt
          { echo "--- Entity: obrot"; sig net.minecraft.world.entity.Entity 'turn|setYRot|setXRot|getViewYRot|getViewXRot|getYRot|getXRot' 20;
            echo "--- MouseHandler"; sig net.minecraft.client.MouseHandler 'turn|Turn|move|Move' 20; } > d3.txt
          { echo "--- CameraType"; javap -p -cp "$JAR" net.minecraft.client.CameraType 2>&1 | sed 's/net\.minecraft\.//g' | head -25;
            echo "--- Options: kamera"; sig net.minecraft.client.Options 'ameraType|CameraType' 10;
            echo "--- GameRenderer: kamera"; sig net.minecraft.client.renderer.GameRenderer 'amera' 25; } > d4.txt
          for n in 1 2 3 4; do node ../launcher/test/annotate.js d$n.txt "Diag $n" notice 6500; done

      - name: Przygotuj jar do wydania
        run: |
          mkdir -p ../dist-mod
          find build/libs -name 'nebula-client-*.jar' ! -name '*-sources.jar' -exec cp {} ../dist-mod/ \;
          ls -la ../dist-mod

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-client
          path: dist-mod/*.jar

      - name: Publikuj jar w wydaniu nebula-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-latest
          name: Nebula (najnowszy build)
          body: |
            Automatyczny build z commita ${{ github.sha }}.
            - nebula-client-*.jar: mod Nebula Client (launcher pobiera go sam)
            - NebulaLauncher-*.exe: launcher dla Windows
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist-mod/nebula-client-*.jar

  # 2. Launcher (.exe) budowany na Windows i dołączany do tego samego wydania.
  launcher:
    needs: mod
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zależności
        run: npm install --no-audit --no-fund > npm.log 2>&1

      - name: Testy launchera
        run: npm test > test.log 2>&1

      - name: Zbuduj .exe
        run: npm run dist > dist.log 2>&1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Pokaż logi przy błędzie
        if: failure()
        run: |
          node test/annotate.js npm.log "npm install" error 3000
          node test/annotate.js test.log "Testy launchera" error 3000
          node test/annotate.js dist.log "electron-builder" error 5000

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-launcher
          path: launcher/dist/NebulaLauncher-*.exe

      - name: Dołącz .exe do wydania
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-latest
          fail_on_unmatched_files: true
          files: launcher/dist/NebulaLauncher-*.exe

  # 3. Test na prawdziwych serwerach Mojang/Fabric/Modrinth + próbny start gry bez okna.
  smoke:
    needs: mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test na prawdziwych serwerach
        run: node test/smoke-net.js > smoke.out 2>&1

      - name: Raport
        if: always()
        run: node test/annotate.js smoke-report.txt "Smoke test" notice 7500
