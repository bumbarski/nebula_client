name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Mod Nebula Client (.jar). Na gałęzi main trafia do wydania "nebula-latest", skąd pobiera go launcher.
  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nebula-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle build --console=plain --stacktrace > build.log 2>&1

      - name: Pokaż błędy builda
        if: failure()
        run: node ../launcher/test/annotate.js build.log "Log builda moda" error 7000

      - name: Przygotuj jar do wydania
        run: |
          mkdir -p ../dist-mod
          find build/libs -name 'nebula-client-*.jar' ! -name '*-sources.jar' -exec cp {} ../dist-mod/ \;
          ls -la ../dist-mod

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-client
          path: dist-mod/*.jar

      - name: Publikuj jar w wydaniu nebula-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-latest
          name: Nebula (najnowszy build)
          body: |
            Automatyczny build z commita ${{ github.sha }}.
            - nebula-client-*.jar: mod Nebula Client (launcher pobiera go sam)
            - NebulaLauncher-*.exe: launcher dla Windows
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist-mod/nebula-client-*.jar

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wersje Fabric API
        run: |
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oE '<version>[^<]*(26\.1|1\.21\.4)[^<]*</version>' | sed 's/<[^>]*>//g' | tail -12 > p.txt
          echo "--- loader" >> p.txt
          curl -s https://meta.fabricmc.net/v2/versions/loader | python3 -c "import json,sys; print([x['version'] for x in json.load(sys.stdin)][:4])" >> p.txt
          echo "--- loom" >> p.txt
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -oE '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -4 >> p.txt
          echo "--- yarn/mc" >> p.txt
          curl -s "https://meta.fabricmc.net/v2/versions/game" | python3 -c "import json,sys; print([x['version'] for x in json.load(sys.stdin) if x['version'] in ('26.1.2','1.21.4','26.2')])" >> p.txt
          node launcher/test/annotate.js p.txt "Probe" notice 4000

  # 2. Launcher (.exe) budowany na Windows i dołączany do tego samego wydania.
  launcher:
    needs: mod
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zależności
        run: npm install --no-audit --no-fund > npm.log 2>&1

      - name: Testy launchera
        run: npm test > test.log 2>&1

      - name: Zbuduj .exe
        run: npm run dist > dist.log 2>&1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Pokaż logi przy błędzie
        if: failure()
        run: |
          node test/annotate.js npm.log "npm install" error 3000
          node test/annotate.js test.log "Testy launchera" error 3000
          node test/annotate.js dist.log "electron-builder" error 5000

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-launcher
          path: launcher/dist/NebulaLauncher-*.exe

      - name: Dołącz .exe do wydania
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nebula-latest
          fail_on_unmatched_files: true
          files: launcher/dist/NebulaLauncher-*.exe

  # 3. Test na prawdziwych serwerach Mojang/Fabric/Modrinth + próbny start gry bez okna.
  smoke:
    needs: mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test na prawdziwych serwerach
        run: node test/smoke-net.js > smoke.out 2>&1

      - name: Raport
        if: always()
        run: node test/annotate.js smoke-report.txt "Smoke test" notice 7500
